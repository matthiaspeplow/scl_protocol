[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scl-protocol"
version = "0.9.0"
description = "Python library for LyTech LED controller communication via SCL/SuperComm protocol"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Matthias Peplow"}
]
keywords = ["led", "controller", "lytech", "scl2008", "supercomm", "hardware", "protocol", "library"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: System :: Hardware",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "Pillow>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/scl-protocol"
Documentation = "https://github.com/yourusername/scl-protocol#readme"
Repository = "https://github.com/yourusername/scl-protocol"

[tool.setuptools]
packages = ["scl_protocol"]
